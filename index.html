<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PKIC_Website</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Belleza&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pacifico&family=Poppins:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <div class="logo__container">
          <img
            class="logo__img"
            src="./Assets/pkic_logo2.png"
            alt="PKIC LOGO"
          />
          <p class="logo__text">PKIC Mirzapur</p>
        </div>
        <button class="hamburger__btn">
          <img
            class="hamburger__btn__img"
            src="./Assets/menu-bar.png"
            alt="MENU"
          />
        </button>
      </nav>

      <aside class="sidebar">
        <div class="sidebar__header">
          <div class="sidebar__logo__container">
            <img
              class="sidebar__logo__img"
              src="./Assets/pkic_logo2.png"
              alt="PKIC LOGO"
            />

            <h4 class="sidebar__logo__text">PKIC Mirzapur</h4>
            <p class="sidebar__logo__text2">Public Kanya Inter College</p>
          </div>
          <button class="sidebar__closeBtn">
            <img class="closepng" src="./Assets/close.png"/>
          </button>
        </div>
      </aside>

      <div class="sidebar__backdrop"></div>
    </header>

    <script src="./JS/script.js"></script>
  </body>
</html>
