<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="/Assets/Images/PKIC_LOGO_LITE.png"
    />
    <title>PKIC | Contact Us</title>

    <meta name="application-name" content="PKIC Mirzapur" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="stylesheet" href="/CSS/style.css" />
    <link rel="stylesheet" href="/CSS/animations.css" />
    <link rel="stylesheet" href="/CSS/pages/contact.css" />

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/gsap.min.js"
      integrity="sha512-VMHB/Dy1/3d+djJPdMhxbplbZgbfPNHy+yWCxB1MSrwUEcNE+gnviL/DwlGsh9wwobnRTiQc6ChK2ZoJamshXA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/ScrollTrigger.js"
      integrity="sha512-4iHDKNbMvI3vN8PaG2om0+XXbn4BKjhdoi/Tnn8P7EBmqitPjNxGwtykyQOMcUGX+KbUQ0jHrBipOGfgE6Dkww=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>

    <script defer type="module" src="/JS/main.js"></script>
    <script defer type="module" src="/JS/pages/contact.js"></script>
  </head>
  <body>
    <!-- PKIC Mobile Loader -->
    <div
      class="pkic-loader"
      id="pkic-loader"
      role="status"
      aria-live="polite"
      aria-label="Loading PKIC website"
      data-include="/components/loader.html"
    ></div>

    <header class="header" data-include="/components/navbar.html"></header>

    <main class="main">
      <section id="section__contact--hero" class="section">
        <div id="contact--hero__headings" class="sections__headings">
          <p id="contact--hero__kicker" class="headings__kicker">CONTACT</p>
          <h2 id="contact--hero__title" class="hero__heading headings__title">
            Contact Us
          </h2>
          <p id="contact--hero__intro" class="headings__intro">
            Visit the school office, call us or send a message on WhatsApp.
          </p>
        </div>
      </section>

      <section id="section__contact--actions" class="section">
        <div class="contact--actions__container">
          <a href="tel:+91-8376958340" class="actions action__call">
            <img
              class="action__icon icon"
              src="/Assets/Images/phone-icon.svg"
              alt=""
            />
            <p class="action__title">Call</p>
            <p class="action__info">+91 8376958340</p>
            <img
              class="action__arrow icon"
              src="/Assets/Images/arrow-right.svg"
              alt=""
            />
          </a>
          <a href="https://wa.me/918376958340" class="action__whatsapp actions">
            <img
              class="action__icon icon"
              src="/Assets/Images/whatsapp.png"
              alt=""
            />
            <p class="action__title">Whatsapp</p>
            <p class="action__info">+91 8376958340</p>
            <img
              class="action__arrow icon"
              src="/Assets/Images/arrow-right.svg"
              alt=""
            />
          </a>
          <a
            href="mailto:principlepkic@gmail.com"
            class="action__email actions"
          >
            <img
              class="action__icon icon"
              src="/Assets/Images/mail.svg"
              alt=""
            />
            <p class="action__title">Email</p>
            <p class="action__info">principlepkic@gmail.com</p>
            <img
              class="action__arrow icon"
              src="/Assets/Images/arrow-right.svg"
              alt=""
            />
          </a>
        </div>
      </section>

      <section id="section__contact--message__form" class="section">
        <div class="message__form__container">
          <h3 class="form__heading">Send us a message</h3>
          <form class="message__form">
            <label for="name" class="name__label">Your name</label>
            <input
              type="text"
              name="name"
              id="name"
              minlength="2"
              maxlength="50"
              autocomplete="name"
              placeholder="Enter your name"
              required
            />
            <label for="phone">Mobile number</label>
            <input
              type="tel"
              name="phone"
              id="phone"
              maxlength="10"
              minlength="10"
              pattern="[6-9][0-9]{9}"
              autocomplete="tel"
              placeholder="10-digit mobile number"
              required
            />
            <label for="message">Message</label>
            <textarea
              name="message"
              id="message"
              rows="5"
              cols="35"
              placeholder="How can we help you?"
              maxlength="300"
              required
            ></textarea>
            <button class="btn btn--primary" type="submit">Send Message</button>
          </form>
        </div>
      </section>

      <section id="section__map" class="section__map section">
        <div class="map__container section__container">
          <div class="map__headings sections__headings">
            <p class="map__kicker headings__kicker">VISIT US</p>
            <h2 class="map__title headings__title">Find us in Mirzapur</h2>
          </div>

          <div class="map__location">
            <iframe
              title="Map showing Public Kanya Inter College"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3533.607064159624!2d79.558438775663!3d27.667626327241887!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x399fcf9832a040c7%3A0x471d7cfa45c6751!2sPublic%20Kanya%20Inter%20College!5e0!3m2!1sen!2sin!4v1793376697924!5m2!1sen!2sin"
              width="300"
              height="200"
              style="border: 0"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
          </div>

          <div class="map__address">
            <p class="address__city">Mirzapur, Uttar Pradesh</p>
            <p class="address__contact">+91 8376958340 | MON-SAT - 7AM-2PM</p>
          </div>
        </div>
      </section>
    </main>

    <footer
      class="footer section"
      data-include="/components/footer.html"
    ></footer>
  </body>
</html>
